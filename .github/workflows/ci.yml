name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ubuntu media and display packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libmpv1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxkbcommon-x11-0 xvfb
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              ffmpeg -version | Select-Object -First 1
              break
            }
            if ($attempt -eq 3) { throw "FFmpeg is unavailable after $attempt Chocolatey attempts" }
            Start-Sleep -Seconds (10 * $attempt)
          }
      - run: python -m pip install -e ".[dev]"
      - name: Verify Ubuntu Qt xcb dependencies
        if: runner.os == 'Linux'
        run: |
          plugin=$(python -c 'import PySide6; from pathlib import Path; print(Path(PySide6.__file__).parent / "Qt/plugins/platforms/libqxcb.so")')
          ldd "$plugin"
          if ldd "$plugin" | grep -q 'not found'; then exit 1; fi
      - name: Fetch Windows libmpv
        if: runner.os == 'Windows'
        run: python scripts/fetch_libmpv.py
      - run: ruff check src scripts tests
      - run: python scripts/make_test_media.py
      - run: python scripts/make_test_media.py --corrupt
      - name: Test native player lifecycle on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: python -u -m pytest -vv tests/test_player.py --cov=src/vplayer --cov=scripts --cov-report= --cov-fail-under=0
      - name: Test remaining cases on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: python -u -m pytest -vv --ignore=tests/test_player.py --cov=src/vplayer --cov=scripts --cov-append --cov-report=term-missing --cov-fail-under=80
      - name: Report painted action latency on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q -s tests/test_speed.py::test_action_to_painted_acknowledgement_p95
      - name: Test corrupt corpus on Ubuntu
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: xvfb-run -a python -u -X faulthandler -m pytest -x -vv -s tests/test_corrupt.py --cov=src/vplayer --cov=scripts --cov-report= --cov-fail-under=0
      - name: Test remaining cases on Ubuntu
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          files=(tests/test_*.py)
          for ((start=0; start<${#files[@]}; start+=10)); do
            timeout 8m xvfb-run -a python -u -X faulthandler -m pytest -x -vv -s \
              "${files[@]:start:10}" --deselect=tests/test_corrupt.py \
              --cov=src/vplayer --cov=scripts --cov-append --cov-report= --cov-fail-under=0
          done
          python -m coverage report -m --fail-under=80
      - name: Report emulated SFTP playback latency
        if: runner.os == 'Linux'
        run: |
          docker info > /dev/null
          xvfb-run -a python -m pytest -q -s tests/test_sftp_perf.py
