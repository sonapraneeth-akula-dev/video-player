name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ubuntu media and display packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libmpv1 libxcb-cursor0 xvfb
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: python -m pip install -e ".[dev]"
      - name: Fetch Windows libmpv
        if: runner.os == 'Windows'
        run: python scripts/fetch_libmpv.py
      - run: ruff check src scripts tests
      - run: python scripts/make_test_media.py
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q --cov=src/vplayer --cov=scripts --cov-report=term-missing --cov-fail-under=80
      - name: Test on Ubuntu
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --cov=src/vplayer --cov=scripts --cov-report=term-missing --cov-fail-under=80

