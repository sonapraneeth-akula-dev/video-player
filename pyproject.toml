[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vplayer"
version = "0.27.0"
description = "Desktop video player for local and SFTP media"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.8.3",
    "python-mpv==1.0.8",
    "paramiko>=5,<6",
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-qt", "ruff", "psutil"]
package = ["pyinstaller>=6,<7"]

[project.scripts]
vplayer = "vplayer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sftp: requires a running local Docker Linux daemon"]
# Windows libmpv/LuaJIT emits SEH exceptions that pytest's fault handler can turn into a crash.
addopts = "-p no:faulthandler"

[tool.ruff]
target-version = "py312"
